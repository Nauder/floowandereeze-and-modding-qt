[project]
name = "floowandereeze-and-modding-qt"
version = "0.1.0"
description = "Tool to mod the Yu-Gi-Oh! Master Duel game"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altgraph==0.17.4",
    "black>=26.5.1",
    "brotli>=1.2.0",
    "certifi==2024.8.30",
    "charset-normalizer==3.3.2",
    "click==8.1.7",
    "colorama==0.4.6",
    "cramjam>=2.8.3",
    "darkdetect==0.8.0",
    "etcpak>=0.9.9",
    "fastparquet==2024.5.0",
    "fsspec==2024.9.0",
    "greenlet>=3.0.3",
    "idna==3.10",
    "lz4==4.3.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "numpy==2.1.1",
    "packaging==24.1",
    "pandas>=2.3.3",
    "pefile==2024.8.26",
    "pillow>=11.3.0",
    "pyfmodex==0.7.2",
    "pyinstaller==6.10.0",
    "pyinstaller-hooks-contrib==2024.8",
    "pylint>=4.0.6",
    "pyqt-toast-notification==1.3.2",
    "pyside6==6.7.2",
    "pyside6-addons==6.7.2",
    "pyside6-essentials==6.7.2",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.0.1",
    "pytz==2024.2",
    "pywin32-ctypes==0.2.3",
    "qtpy==2.4.1",
    "requests==2.32.4",
    "shiboken6==6.7.2",
    "six==1.16.0",
    "sqlalchemy==2.0.34",
    "tabulate==0.9.0",
    "texture2ddecoder>=1.0.5",
    "typing-extensions==4.12.2",
    "tzdata==2024.1",
    "unitypy==1.25.2",
    "urllib3==2.5.0",
]

[tool.pylint.main]
extension-pkg-allow-list = ["PySide6"]
persistent = false

[tool.pylint.typecheck]
generated-members = [
    ".*\\.connect",
    ".*\\.emit",
]
